[project]
name = "mbnet"
version = "0.1.0"
description = "Analysis of Monotone Boolean Functions across Network Topologies"
authors = [
    {name = "Harshavardhan-BV",email = "bharshavardh@iisc.ac.in"}
]
license = {text = "GPL-3.0-or-later"}
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "numpy (>=2.3.2,<3.0.0)",
    "pandas (>=2.3.1,<3.0.0)",
    "matplotlib (>=3.10.3,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "networkx (>=3.5,<4.0)",
    "scipy (>=1.16.1,<2.0.0)"
]
classifiers = [
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
]

[project.urls]
homepage = "https://github.com/Harshavardhan-BV/MBF-Topo"
repository = "https://github.com/Harshavardhan-BV/MBF-Topo"
documentation = "https://Harshavardhan-BV.github.io/MBF-Topo/"
"Bug Tracker" = "https://github.com/Harshavardhan-BV/MBF-Topo/issues"

[project.scripts]
state_count = "mbnet.state_count:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  {include-group = "docs"},
  {include-group = "interactive"},
  {include-group = "test"}
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-ipynb>=0.1.1",
    "mkdocs-material>=9.6.22",
    "mkdocstrings-python>=1.18.2",
]
interactive = [
    "ipykernel>=7.1.0",
]
test = [
    "flake8>=7.3.0",
    "pytest>=8.4.2",
]
